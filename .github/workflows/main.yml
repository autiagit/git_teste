name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

jobs:
  test_and_lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black pytest coverage

      - name: Lint and format
        run: |
          ruff check .
          black --check . --diff

      - name: Run tests and get coverage
        run: |
          coverage run -m pytest
          coverage report --fail-under=80

  # Job de deploy para Homologação
  deploy_homolog:
    needs: [test_and_lint]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Deploy to Homologation
        run: |
          echo "Iniciando deploy para o ambiente de homologação..."
          echo "Deploy para o ambiente de homologação concluído!"

  # Job de deploy para Produção
  deploy_prod:
    needs: [deploy_homolog]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Deploy to Production
        run: |
          echo "Iniciando deploy para o ambiente de produção..."
          echo "Deploy para o ambiente de produção concluído! 🎉"
